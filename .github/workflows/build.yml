name: Build and Sign EgyPlayer Gradle

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Unzip and Sed
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip sed

      - name: Extract Java Source Code
        run: |
          mkdir -p app/src/main/java
          unzip -q 2-Full-Source-Code.zip -d app/src/main/java

      - name: Update API URL to egyplayer.com
        run: |
          find app/src/main/java -type f -name "*.java" -exec sed -i 's|http://.*egyplayer\.com|https://egyplayer.com|g' {} + || true
          find app/src/main/java -type f -name "*.java" -exec sed -i 's|https://.*egyplayer\.com|https://egyplayer.com|g' {} + || true

      - name: Setup Gradle Project
        run: |
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          // Top-level build file
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.egyplayer.iptv"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          repositories {
              google()
              mavenCentral()
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.egyplayer.iptv">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="EgyPlayer"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".NormalMainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.CATEGORY_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download and Install Gradle 7.5
        run: |
          wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          sudo mv gradle-7.5 /opt/gradle
          sudo ln -s /opt/gradle/bin/gradle /usr/local/bin/gradle

      - name: Build APK with Gradle 7.5
        run: |
          gradle clean assembleDebug

      - name: Sign APK with Debug Key
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          jarsigner -keystore debug.keystore -storepass android -keypass android "$APK_FILE" androiddebugkey
          cp "$APK_FILE" egyplayer-fixed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
