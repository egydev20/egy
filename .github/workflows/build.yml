name: Bypass Expiration Screen in Smali

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl sed zipalign apksigner

          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download Original APK
        run: |
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"

      - name: Decompile APK
        run: |
          apktool d -r original.apk -o decoded_apk

      - name: Update Server URL
        run: |
          find decoded_apk -type f -name "*.smali" -exec sed -i 's|https\?://[^"'\''[:space:]]*/api\.php|https://egyplayer.com/egypro/api.php|g' {} + || true

      - name: Bypass Expiration Logic
        run: |
          echo "=== البحث عن شاشة انتهاء الصلاحية وتعطيلها ==="
          # البحث عن السطر البرمجي الذي يعرض رسالة انتهاء التفعيل وإلغاء تفعيله أو جعله يتخخطى الفحص
          find decoded_apk/smali -type f -name "*.smali" -exec sed -i 's/has expired/is_active_player/g' {} + || true
          
          # عكس شروط التحقق الخاصة بالصلاحية (إجبار التطبيق على اعتبار الترخيص صالحاً)
          find decoded_apk/smali -type f -name "*.smali" -exec sed -i 's/if-eqz/if-nez/g' {} + || true

      - name: Rebuild, Zipalign, and Sign APK
        run: |
          apktool b decoded_apk --use-aapt2 -o rebuilt_unsigned.apk
          zipalign -p -f 4 rebuilt_unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias egyplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=EgyPlayer,O=EGYSAT,C=EG"
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out egyplayer-bypassed.apk aligned.apk
          apksigner verify -v egyplayer-bypassed.apk

      - name: Upload Bypassed APK
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-bypassed
          path: egyplayer-bypassed.apk
