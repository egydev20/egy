name: Build Stable APK Clean Mode

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools & Decompile
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl sed zipalign apksigner
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"
          apktool d -r original.apk -o decoded_apk

      - name: Clean and Safe bypass.js Injection
        run: |
          mkdir -p decoded_apk/assets/Web
          cat << 'EOF' > decoded_apk/assets/Web/bypass.js
          (function (win) {
              "use strict";
              var targetMac = "34:B2:0A:EF:C1:36";
              var targetKey = "320155209";

              // 1. حقن بيانات التفعيل مباشرة لقرائتها محلياً دون أخطاء
              try {
                  localStorage.setItem("status", "active");
                  localStorage.setItem("Status", "active");
                  localStorage.setItem("IsValid", "true");
                  localStorage.setItem("active", "true");
                  localStorage.setItem("RemainDays", "365");
                  localStorage.setItem("expire_date", "2030-12-31");
                  localStorage.setItem("deviceMAC", targetMac);
                  localStorage.setItem("deviceKey", targetKey);
              } catch(e) {}

              // 2. إخفاء رسائل انتهاء الصلاحية إن وجدت دون التأثير على عمل الواجهة
              setInterval(function() {
                  try {
                      var elements = document.querySelectorAll("span, p, h1, h2, h3, h4, div");
                      for (var i = 0; i < elements.length; i++) {
                          var txt = (elements[i].innerText || "").trim().toLowerCase();
                          if (
                              txt.indexOf("activation for egy player has expired") !== -1 ||
                              txt.indexOf("please renew your activation") !== -1 ||
                              txt.indexOf("status: expired") !== -1
                          ) {
                              elements[i].style.display = "none";
                          }
                      }
                  } catch(e) {}
              }, 100);

          })(window);
          EOF

          # ربط السكربت بسلام في ملف index.html
          if [ -f "decoded_apk/assets/Web/index.html" ]; then
              sed -i 's/<head>/<head><script src="bypass.js"><\/script>/g' decoded_apk/assets/Web/index.html
          fi

          sed -i 's/iget-object v2, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v2, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
          sed -i 's/iget-object v1, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v1, 0x0/g' decoded_apk/smali/c/b/f1.smali || true

      - name: Rebuild, Align and Sign APK
        run: |
          apktool b decoded_apk --use-aapt2 -o rebuilt_unsigned.apk
          zipalign -p -f 4 rebuilt_unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias egyplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=EgyPlayer,O=EGYSAT,C=EG"
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out egyplayer-hostinger.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-hostinger-release
          path: egyplayer-hostinger.apk
