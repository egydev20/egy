      - name: Create bypass.js to Remove Renewal & Fix Credentials
        run: |
          mkdir -p decoded_apk/assets/Web
          cat << 'EOF' > decoded_apk/assets/Web/bypass.js
          (function (win) {
              "use strict";
              var API_URL = "https://egyplayer.com/API/router.php";

              win.isLoaderOnlineCFEnabled = function () { return false; };
              win.isAppOnlineCFEnabled = function () { return false; };

              // تثبيت الماك والمفتاح ليطابقان لوحة التحكم تماماً ودون تغيير
              win.getMac = function () {
                  return "34:B2:0A:EF:C1:36";
              };

              win.makeKey = function (mac) {
                  return "320155209";
              };

              try {
                  localStorage.setItem("__persistUID", "34:B2:0A:EF:C1:36");
                  localStorage.setItem("__deviceMAC", "34:B2:0A:EF:C1:36");
                  localStorage.setItem("__deviceKey", "320155209");
                  localStorage.setItem("RemainDays", "365");
                  localStorage.setItem("Status", "active");
                  localStorage.setItem("IsValid", "true");
              } catch(e) {}

              // إرسال البيانات للسيرفر لتسجيل الجهاز في لوحة التحكم تلقائياً
              var syncServer = function() {
                  try {
                      var xhr = new XMLHttpRequest();
                      xhr.open("POST", API_URL, true);
                      xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
                      xhr.send(JSON.stringify({ mac: "34:B2:0A:EF:C1:36", key: "320155209" }));
                  } catch(e) {}
              };
              setInterval(syncServer, 20000);
              setTimeout(syncServer, 500);

              // اعتراض أي فحص للانتهاء وإجباره على قبول التفعيل
              var OG_SEND = XMLHttpRequest.prototype.send;
              XMLHttpRequest.prototype.send = function () {
                  var u = (this._url || "").toLowerCase();
                  if (u.indexOf("duplex") !== -1 || u.indexOf("geo") !== -1 || u.indexOf("renew") !== -1 || u.indexOf("status") !== -1 || u.indexOf("addrenewal") !== -1) {
                      var s = this;
                      setTimeout(function () {
                          var res = JSON.stringify({ Status: true, status: "active", IsValid: true, RemainDays: 365, mac: "34:B2:0A:EF:C1:36", key: "320155209" });
                          try {
                              Object.defineProperty(s, "status", { value: 200, writable: true });
                              Object.defineProperty(s, "readyState", { value: 4, writable: true });
                              Object.defineProperty(s, "responseText", { value: res, writable: true });
                          } catch (e) {}
                          if (s.onload) s.onload();
                          if (s.onreadystatechange) s.onreadystatechange();
                      }, 10);
                      return;
                  }
                  return OG_SEND.apply(this, arguments);
              };

              // إزالة وإخفاء نوافذ التجديد والدفع نهائياً من الواجهة
              setInterval(function() {
                  var dialogs = document.querySelectorAll("[class*='expired'], [class*='Expired'], [class*='activation'], [class*='Activation']");
                  for(var i=0; i<dialogs.length; i++) {
                      dialogs[i].style.display = "none";
                  }
              }, 100);

          })(window);
          EOF

          # تعطيل فحص التوقيع
          sed -i 's/iget-object v2, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v2, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
          sed -i 's/iget-object v1, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v1, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
