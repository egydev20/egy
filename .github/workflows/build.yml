name: Build APK Connected to Hostinger PHP

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools & Decompile
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl sed zipalign apksigner
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"
          apktool d -r original.apk -o decoded_apk

      - name: Inject bypass.js (Fix Connection & Hide Specific UI)
        run: |
          mkdir -p decoded_apk/assets/Web
          cat << 'EOF' > decoded_apk/assets/Web/bypass.js
          (function (win) {
              "use strict";
              var targetMac = "34:B2:0A:EF:C1:36";
              var targetKey = "320155209";
              var API_URL = "https://egyplayer.com/API/router.php";

              // 1. إصلاح الاتصال: السماح للإنترنت بالعمل وتعديل الماك المرسل فقط للوحة
              var OG_OPEN = XMLHttpRequest.prototype.open;
              XMLHttpRequest.prototype.open = function(method, url) {
                  this._url = url;
                  return OG_OPEN.apply(this, arguments);
              };

              var OG_SEND = XMLHttpRequest.prototype.send;
              XMLHttpRequest.prototype.send = function (body) {
                  // إذا كان الطلب يحتوي على بيانات JSON، نعدل الماك ليتطابق مع لوحة التحكم
                  if (body && typeof body === "string" && body.indexOf("{") !== -1) {
                      try {
                          var data = JSON.parse(body);
                          if (data.mac || data.deviceMAC || data.deviceID) {
                              data.mac = targetMac;
                              data.deviceMAC = targetMac;
                              data.deviceID = targetMac;
                              data.key = targetKey;
                              data.deviceKey = targetKey;
                              body = JSON.stringify(data);
                          }
                      } catch(e) {}
                  }
                  // إرسال الطلب بشكل طبيعي جداً دون إيقافه
                  return OG_SEND.call(this, body);
              };

              // 2. المزامنة المستمرة مع السيرفر الخاص بك
              var syncServer = function() {
                  try {
                      var xhr = new XMLHttpRequest();
                      xhr.open("POST", API_URL, true);
                      xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
                      xhr.send(JSON.stringify({ mac: targetMac, key: targetKey }));
                  } catch(e) {}
              };
              setInterval(syncServer, 10000);
              setTimeout(syncServer, 500);

              // 3. إخفاء دقيق للعناصر المحددة بالبرتقالي فقط
              setInterval(function() {
                  var elements = document.querySelectorAll("div, button, span");
                  for (var i = 0; i < elements.length; i++) {
                      var txt = (elements[i].innerText || "").trim().toLowerCase();
                      
                      // إخفاء أزرار التفعيل والتجديد فقط
                      if (txt === "renew activation" || txt === "i have activation") {
                          elements[i].style.display = "none";
                      }
                      
                      // إخفاء صندوق الأسعار فقط
                      if (txt.indexOf("six months activation cost") !== -1 || txt.indexOf("one year activation cost") !== -1) {
                          // التأكد من إخفاء الصندوق الداخلي فقط وليس خلفية الشاشة بأكملها
                          if (elements[i].offsetHeight < 250) {
                              elements[i].style.display = "none";
                          }
                      }
                  }
              }, 200);

          })(window);
          EOF
          
          sed -i 's/iget-object v2, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v2, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
          sed -i 's/iget-object v1, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v1, 0x0/g' decoded_apk/smali/c/b/f1.smali || true

      - name: Rebuild, Align and Sign APK
        run: |
          apktool b decoded_apk --use-aapt2 -o rebuilt_unsigned.apk
          zipalign -p -f 4 rebuilt_unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias egyplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=EgyPlayer,O=EGYSAT,C=EG"
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out egyplayer-hostinger.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-hostinger-release
          path: egyplayer-hostinger.apk
