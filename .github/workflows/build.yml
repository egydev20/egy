name: Print API Report Directly

on:
  push:
    branches: [ main ]

jobs:
  print_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl sed

          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download & Decompile APK
        run: |
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"
          apktool d -r original.apk -o decoded_apk

      - name: Print Exact Server Config & API Calls to Log
        run: |
          echo "========================================="
          echo "=== 1. البحث عن الروابط وملفات الـ API في التطبيق ==="
          echo "========================================="
          grep -rnE "api\.php|panel_api|get_live|login|activation|check" decoded_apk/smali*/ | head -n 40 || true

          echo "========================================="
          echo "=== 2. البحث عن متغيرات التفعيل (Device ID & Key) ==="
          echo "========================================="
          grep -rnE "device_id|device_key|mac_address|expire_date|is_trial" decoded_apk/smali*/ | head -n 40 || true
