name: Rebuild and Sign EgyPlayer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip sed

      - name: Extract Source Code
        run: |
          mkdir -p extracted_source
          unzip -q 2-Full-Source-Code.zip -d extracted_source

      - name: Locate Project Path Deeply
        run: |
          # البحث العميق عن مسار المجلد الذي يحتوي على ملف apktool.yml
          FOUND_FILE=$(find extracted_source -name "apktool.yml" | head -n 1)
          if [ -n "$FOUND_FILE" ]; then
            PROJECT_DIR=$(dirname "$FOUND_FILE")
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
            echo "Found project at: $PROJECT_DIR"
          else
            echo "PROJECT_DIR=extracted_source" >> $GITHUB_ENV
            echo "Warning: apktool.yml not found, using default."
          fi

      - name: Update API URL to egyplayer.com
        run: |
          DIR="${{ env.PROJECT_DIR }}"
          echo "Target Directory: $DIR"
          find "$DIR" -type f \( -name "*.java" -o -name "*.smali" -o -name "*.xml" \) -exec sed -i 's|http://.*egyplayer\.com|https://egyplayer.com|g' {} + || true
          find "$DIR" -type f \( -name "*.java" -o -name "*.smali" -o -name "*.xml" \) -exec sed -i 's|https://.*egyplayer\.com|https://egyplayer.com|g' {} + || true

      - name: Rebuild APK
        run: |
          apktool b "${{ env.PROJECT_DIR }}" -o egyplayer-fixed.apk

      - name: Sign APK with Debug Key
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          jarsigner -keystore debug.keystore -storepass android -keypass android egyplayer-fixed.apk androiddebugkey

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
