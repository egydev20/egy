name: Rebuild and Sign EgyPlayer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip sed

      - name: Inspect ZIP Contents
        run: |
          echo "=== محتويات ملف الـ ZIP ==="
          unzip -l 2-Full-Source-Code.zip

      - name: Extract Source Code
        run: |
          mkdir -p extracted_source
          unzip -q 2-Full-Source-Code.zip -d extracted_source

      - name: Rebuild APK
        run: |
          # البحث الشامل عن مكان apktool.yml وبناء التطبيق منه فوراً
          PROJECT_DIR=$(find extracted_source -name "apktool.yml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "خطأ: لم يتم العثور على ملف apktool.yml، سنستخدم المجلد الحالي"
            PROJECT_DIR="extracted_source"
          else
            echo "تم العثور على المشروع في مسار: $PROJECT_DIR"
          fi
          
          # تحديث روابط السيرفر داخل المشروع المكتشف
          find "$PROJECT_DIR" -type f \( -name "*.java" -o -name "*.smali" -o -name "*.xml" \) -exec sed -i 's|http://.*egyplayer\.com|https://egyplayer.com|g' {} + || true
          find "$PROJECT_DIR" -type f \( -name "*.java" -o -name "*.smali" -o -name "*.xml" \) -exec sed -i 's|https://.*egyplayer\.com|https://egyplayer.com|g' {} + || true

          # إعادة بناء الـ APK
          apktool b "$PROJECT_DIR" -o egyplayer-fixed.apk

      - name: Sign APK with Debug Key
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          jarsigner -keystore debug.keystore -storepass android -keypass android egyplayer-fixed.apk androiddebugkey

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
