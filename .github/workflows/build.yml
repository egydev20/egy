name: Filter Short API Strings

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools & Decompile
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl sed
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"
          apktool d -r original.apk -o decoded_apk

      - name: Print Only Short Summary
        run: |
          echo "=== 1. مسارات الـ API داخل x0.smali (مختصر جداً) ==="
          grep -n "const-string" decoded_apk/smali/c/b/x0.smali | grep -iE "API/|http|mac|status|expire|date|key|token|login|device|sub|channel|playlist|url" || true

          echo -e "\n=== 2. مسارات الـ API داخل f1.smali و z0.smali ==="
          grep -n "const-string" decoded_apk/smali/c/b/f1.smali decoded_apk/smali/c/b/z0.smali | grep -iE "API/|http|mac|status|expire|date|key|token|login|device|sub| result|data|code" || true

          echo -e "\n=== 3. قائمة أسماء ملفات الـ Web ==="
          find decoded_apk/assets/Web -maxdepth 2 || true
