name: Deep Smali String Inspection

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl sed zipalign apksigner

          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download Original APK
        run: |
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"

      - name: Decompile APK
        run: |
          apktool d -f original.apk -o decoded_apk

      - name: Extract App Specific URLs and Packages
        run: |
          {
            echo "=== 1. هيكل مجلدات الكود البرمجي للتطبيق (Packages) ==="
            find decoded_apk/smali* -maxdepth 4 -type d | grep -vE "androidx|org/videolan|com/google|kotlin|kotlinx|okhttp3|retrofit2|com/bumptech" || true

            echo -e "\n=== 2. جميع الروابط الصريحة (http/https) داخل الكود ==="
            grep -rn "const-string" decoded_apk/smali* | grep -iE "http://|https://" | grep -vE "schemas.android.com|w3.org|apache.org|google.com|xml.org|github.com" || true

            echo -e "\n=== 3. مسارات الـ API وملفات PHP أو JSON داخل الكود ==="
            grep -rn "const-string" decoded_apk/smali* | grep -iE "\.php|api/|/api|egyplayer|ibo|mac|expire|device_key" | grep -vE "androidx|org/videolan|com/google" || true

            echo -e "\n=== 4. فحص الروابط في ملفات الموارد (strings.xml) ==="
            grep -rnE "http|egyplayer|api" decoded_apk/res/values* || true
          } > app_urls_report.txt

          cat app_urls_report.txt

      - name: Upload Clean Report
        uses: actions/upload-artifact@v4
        with:
          name: app-urls-report
          path: app_urls_report.txt
