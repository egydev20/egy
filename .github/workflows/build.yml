name: Build Full EgyPlayer APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip sed wget

      - name: Prepare Android Project Structure
        run: |
          mkdir -p my_android_project/app/src/main/java
          mkdir -p my_android_project/app/src/main/res/values
          
          # فك ملف السورس الكود في مسار الجافا الصحيح
          unzip -q 2-Full-Source-Code.zip -d my_android_project/app/src/main/java

          # تعديل الروابط ديناميكياً داخل ملفات الجافا إلى egyplayer.com
          find my_android_project/app/src/main/java -type f -name "*.java" -exec sed -i 's|http://.*egyplayer\.com|https://egyplayer.com|g' {} + || true
          find my_android_project/app/src/main/java -type f -name "*.java" -exec sed -i 's|https://.*egyplayer\.com|https://egyplayer.com|g' {} + || true

          cd my_android_project

          echo "include ':app'" > settings.gradle

          # ملف الـ build.gradle الرئيسي لتعريف مستودعات الـ Android Gradle Plugin
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ملف الـ build.gradle الداخلي للتطبيق
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.egyplayer.iptv"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.egyplayer.iptv">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="EgyPlayer"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name="com.egyplayer.iptv.NormalMainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.CATEGORY_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">EgyPlayer</string>
          </resources>
          EOF

          echo "sdk.dir=$PWD/../android-sdk" > local.properties

      - name: Setup Android SDK and Gradle 7.5
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "platforms;android-33" "build-tools;33.0.2"

          # تحميل وتثبيت Gradle 7.5
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          sudo mv gradle-7.5 /opt/gradle
          sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle

      - name: Build APK via Gradle 7.5
        run: |
          cd my_android_project
          gradle clean assembleDebug

      - name: Sign APK and Copy to Root
        run: |
          cd my_android_project
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" ../egyplayer-fixed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
