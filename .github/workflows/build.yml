      - name: Create bypass.js to Hide Specific Orange Elements
        run: |
          mkdir -p decoded_apk/assets/Web
          cat << 'EOF' > decoded_apk/assets/Web/bypass.js
          (function (win) {
              "use strict";
              var API_URL = "https://egyplayer.com/API/router.php";

              win.isLoaderOnlineCFEnabled = function () { return false; };
              win.isAppOnlineCFEnabled = function () { return false; };

              try {
                  localStorage.setItem("RemainDays", "365");
                  localStorage.setItem("Status", "active");
                  localStorage.setItem("IsValid", "true");
              } catch(e) {}

              // الحفاظ على اتصال التطبيق الدائم بالبهند واللوحة
              var syncServer = function() {
                  try {
                      var xhr = new XMLHttpRequest();
                      xhr.open("POST", API_URL, true);
                      xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
                      xhr.send(JSON.stringify({ mac: "34:B2:0A:EF:C1:36", key: "320155209" }));
                  } catch(e) {}
              };
              setInterval(syncServer, 15000);
              setTimeout(syncServer, 300);

              // اعتراض طلبات الشبكة لتأكيد حالة التفعيل دائماً
              var OG_SEND = XMLHttpRequest.prototype.send;
              XMLHttpRequest.prototype.send = function () {
                  var s = this;
                  setTimeout(function () {
                      var res = JSON.stringify({ Status: true, status: "active", IsValid: true, RemainDays: 365, mac: "34:B2:0A:EF:C1:36", key: "320155209" });
                      try {
                          Object.defineProperty(s, "status", { value: 200, writable: true });
                          Object.defineProperty(s, "readyState", { value: 4, writable: true });
                          Object.defineProperty(s, "responseText", { value: res, writable: true });
                      } catch (e) {}
                      if (s.onload) s.onload();
                      if (s.onreadystatechange) s.onreadystatechange();
                  }, 10);
                  return OG_SEND.apply(this, arguments);
              };

              // إخفاء العناصر المحددة بالبرتقالي فقط (مربع الأسعار وأزرار التجديد) بدقة تامة
              setInterval(function() {
                  var allElements = document.querySelectorAll("div, button, span, p, a");
                  for(var i=0; i<allElements.length; i++) {
                      var text = (allElements[i].innerText || "").toLowerCase();
                      if(
                          text.indexOf("six months activation") !== -1 || 
                          text.indexOf("one year activation") !== -1 || 
                          text.indexOf("renew activation") !== -1 || 
                          text.indexOf("i have activation") !== -1
                      ) {
                          if(allElements[i].offsetHeight < 300) {
                              allElements[i].style.display = "none";
                          }
                      }
                  }
              }, 100);

          })(window);
          EOF
          sed -i 's/iget-object v2, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v2, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
          sed -i 's/iget-object v1, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v1, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
