name: Build and Patch EGY PLAYER

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools & Download APK
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl sed zipalign apksigner perl python3
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          PAGE_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk/file"
          DIRECT_LINK=$(curl -sL "$PAGE_URL" | grep -o 'href="https://download[^"]*"' | sed 's/href="//;s/"//' | head -n 1)
          
          curl -L -o original.apk "$DIRECT_LINK"
          apktool d -r original.apk -o decoded_apk

      - name: Update API Endpoint & Bypass Activation in Smali
        run: |
          # 1. استبدال روابط الـ API بالدومين الفرعي الجديد
          find decoded_apk -type f \( -name "*.smali" -o -name "*.xml" -o -name "*.html" -o -name "*.js" \) -exec sed -i 's|https://egyplayer.com/API|https://edit.egyplayer.com|gI' {} +
          find decoded_apk -type f \( -name "*.smali" -o -name "*.xml" -o -name "*.html" -o -name "*.js" \) -exec sed -i 's|http://egyplayer.com/API|https://edit.egyplayer.com|gI' {} +
          
          # 2. إعدادات الشبكة الآمنة
          mkdir -p decoded_apk/res/xml
          cat << 'EOF' > decoded_apk/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          
          if ! grep -q "networkSecurityConfig" decoded_apk/AndroidManifest.xml; then
              sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" android:usesCleartextTraffic="true" /g' decoded_apk/AndroidManifest.xml
          fi

          # 3. تعديل ملفات الـ Smali لتجاوز التحقق من التفعيل وجعله دائماً True
          python3 - << 'PYTHON_SCRIPT'
          import os, glob

          for filepath in glob.glob('decoded_apk/**/*.smali', recursive=True):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  
                  modified = False
                  # البحث عن الدوال التي تفحص التفعيل أو الصلاحية وتعديل قيم الرجوع لـ True (0x1)
                  if 'Activation' in content or 'expired' in content or 'isExpired' in content or 'IsValid' in content:
                      # استبدال عمليات التحقق الشائعة لتعيد دائماً نجاح أو تفعيل
                      if 'return' in content:
                          # إضافة تعديلات ذكية لتجاوز شروط الخطأ
                          content = content.replace('const/4 v0, 0x0', 'const/4 v0, 0x1')
                          content = content.replace('if-eqz', 'if-nez')
                          modified = True
                  
                  if modified:
                      with open(filepath, 'w', encoding='utf-8') as f:
                          f.write(content)
              except Exception as e:
                  pass
          print("Smali activation bypass patch applied successfully.")
          PYTHON_SCRIPT

      - name: Rebuild, Align and Sign APK
        run: |
          apktool b decoded_apk --use-aapt2 -o rebuilt_unsigned.apk
          zipalign -p -f 4 rebuilt_unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias egyplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=EgyPlayer,O=EGYSAT,C=EG"
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --out egyplayer-hostinger.apk aligned.apk

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-hostinger-release
          path: egyplayer-hostinger.apk
