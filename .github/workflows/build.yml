name: Targeted API Search

on:
  push:
    branches: [ main ]

jobs:
  targeted_search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl sed

          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download & Decompile APK
        run: |
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"
          apktool d -r original.apk -o decoded_apk

      - name: Search App Source Only (Exclude VLC)
        run: |
          echo "=== 1. البحث عن أي روابط http أو https داخل مجلدات التطبيق الأساسية ==="
          grep -rnE "https?://[a-zA-Z0-9./_-]+" decoded_apk/smali/ | grep -vE "videolan|android|w3|apache|google|schema|example" || true

          echo "=== 2. البحث عن الكلمات المفتاحية للتفعيل و Device Key ==="
          grep -rnE "device_key|Device Key|activation|Expire|renewal" decoded_apk/smali/ || true

          echo "=== 3. البحث عن أسماء الملفات أو المسارات (.php أو /api) ==="
          grep -rnE "\.php|/api/|/v1/" decoded_apk/smali/ || true
