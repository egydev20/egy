name: Rebuild and Sign EgyPlayer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip sed

      - name: Extract Source Code
        run: |
          mkdir -p extracted_source
          unzip -q 2-Full-Source-Code.zip -d extracted_source
          ls -la extracted_source

      - name: Rebuild APK
        run: |
          # سنقوم بالبحث الفوري عن مكان apktool.yml والبناء منه مباشرة
          PROJECT_PATH=$(find extracted_source -name "apktool.yml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            PROJECT_PATH="extracted_source"
          fi
          echo "Building from path: $PROJECT_PATH"
          apktool b "$PROJECT_PATH" -o egyplayer-fixed.apk

      - name: Sign APK with Debug Key
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          jarsigner -keystore debug.keystore -storepass android -keypass android egyplayer-fixed.apk androiddebugkey

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
