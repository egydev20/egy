name: Rebuild Full Original EgyPlayer APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip sed apktool

      - name: Extract Full Source & Keep All Assets
        run: |
          mkdir -p extracted_project
          unzip -q 2-Full-Source-Code.zip -d extracted_project
          
          # البحث عن مكان تواجد الملفات واللغات وتعديل السيرفر بدقة مع الحفاظ على المساحة والمكتبات
          find extracted_project -type f \( -name "*.java" -o -name "*.smali" -o -name "*.xml" -o -name "*.json" -o -name "*.smali" \) -exec sed -i 's|http://.*egyplayer\.com|https://egyplayer.com|g' {} + || true
          find extracted_project -type f \( -name "*.java" -o -name "*.smali" -o -name "*.xml" -o -name "*.json" -o -name "*.smali"  \) -exec sed -i 's|https://.*egyplayer\.com|https://egyplayer.com|g' {} + || true

      - name: Rebuild Original APK with Apktool
        run: |
          # تحديد المجلد الذي يحتوي على apktool.yml أو بناء المشروع كاملاً مع موارده ومكتباته الأصلية
          PROJECT_DIR=$(find extracted_project -name "apktool.yml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="extracted_project"
          fi
          
          apktool b "$PROJECT_DIR" -o final-egyplayer.apk || true

      - name: Fallback Build if needed
        run: |
          if [ ! -f "final-egyplayer.apk" ]; then
            cd extracted_project
            zip -r ../final-egyplayer.apk .
            cd ..
          fi

      - name: Sign APK with Debug Key
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 || true
          jarsigner -keystore debug.keystore -storepass android -keypass android final-egyplayer.apk androiddebugkey || true
          cp final-egyplayer.apk egyplayer-fixed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
