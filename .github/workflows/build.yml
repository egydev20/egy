      - name: Replace bypass.js with Instant Activator
        run: |
          cat << 'EOF' > decoded_apk/assets/Web/bypass.js
          (function (win) {
              "use strict";
              var API_URL = "https://egyplayer.com/API/router.php";

              win.isLoaderOnlineCFEnabled = function () { return false; };
              win.isAppOnlineCFEnabled = function () { return false; };

              // تثبيت الأيام المتبقية في الذاكرة لتكون مفعلة دائماً
              try {
                  localStorage.setItem("RemainDays", "365");
                  localStorage.setItem("Status", "active");
                  localStorage.setItem("IsValid", "true");
              } catch(e) {}

              // MAC & KEY
              win.getMac = function () {
                  var id = localStorage.getItem("__persistUID") || "EGY" + Math.random().toString(16).substring(2);
                  localStorage.setItem("__persistUID", id);
                  var clean = id.replace(/[^0-9A-F]/gi, "").toUpperCase();
                  if (clean.length < 12) clean = (clean + "ABCDEF123456").substring(0, 12);
                  var mac = "";
                  for (var i = 0; i < 6; i++) {
                      mac += clean.substring(i * 2, i * 2 + 2);
                      if (i < 5) mac += ":";
                  }
                  return mac;
              };

              win.makeKey = function (mac) {
                  return "915937";
              };

              // إرسال البيانات للسيرفر في الخلفية بصمت
              var syncServer = function() {
                  try {
                      var mac = win.getMac();
                      var xhr = new XMLHttpRequest();
                      xhr.open("POST", API_URL, true);
                      xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
                      xhr.send(JSON.stringify({ mac: mac, key: "915937" }));
                  } catch(e) {}
              };
              setInterval(syncServer, 30000);
              setTimeout(syncServer, 1000);

              // اعتراض أي طلب شبكي للتحقق من الانتهاء وإجباره على النجاح
              var OG_SEND = XMLHttpRequest.prototype.send;
              XMLHttpRequest.prototype.send = function () {
                  var u = (this._url || "").toLowerCase();
                  if (u.indexOf("duplex") !== -1 || u.indexOf("geo") !== -1 || u.indexOf("renew") !== -1 || u.indexOf("status") !== -1) {
                      var s = this;
                      setTimeout(function () {
                          var res = JSON.stringify({ Status: true, status: "active", IsValid: true, RemainDays: 365 });
                          try {
                              Object.defineProperty(s, "status", { value: 200, writable: true });
                              Object.defineProperty(s, "readyState", { value: 4, writable: true });
                              Object.defineProperty(s, "responseText", { value: res, writable: true });
                          } catch (e) {}
                          if (s.onload) s.onload();
                          if (s.onreadystatechange) s.onreadystatechange();
                      }, 10);
                      return;
                  }
                  return OG_SEND.apply(this, arguments);
              };

              // إخفاء رسائل الانتهاء من الواجهة نهائياً
              setInterval(function() {
                  var expiredDialogs = document.querySelectorAll("[class*='expired'], [class*='Expired']");
                  for(var i=0; i<expiredDialogs.length; i++) {
                      expiredDialogs[i].style.display = "none";
                  }
              }, 200);

          })(window);
          EOF

          # تعطيل فحص التوقيع
          sed -i 's/iget-object v2, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v2, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
          sed -i 's/iget-object v1, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v1, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
