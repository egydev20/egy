      - name: Create bypass.js to Strip Activation UI
        run: |
          mkdir -p decoded_apk/assets/Web
          cat << 'EOF' > decoded_apk/assets/Web/bypass.js
          (function (win) {
              "use strict";
              var API_URL = "https://egyplayer.com/API/router.php";

              win.isLoaderOnlineCFEnabled = function () { return false; };
              win.isAppOnlineCFEnabled = function () { return false; };

              try {
                  localStorage.setItem("RemainDays", "365");
                  localStorage.setItem("Status", "active");
                  localStorage.setItem("IsValid", "true");
              } catch(e) {}

              // إرسال الماك الحقيقي للجهاز للسيرفر فوراً
              var syncServer = function() {
                  try {
                      var mac = "";
                      if (win.PlayerInterface1 && win.PlayerInterface1.getDeviceId) mac = win.PlayerInterface1.getDeviceId();
                      else mac = localStorage.getItem("__persistUID") || "C2:ED:89:66:E1:AE";
                      
                      var xhr = new XMLHttpRequest();
                      xhr.open("POST", API_URL, true);
                      xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
                      xhr.send(JSON.stringify({ mac: mac, key: "253247" }));
                  } catch(e) {}
              };
              setInterval(syncServer, 15000);
              setTimeout(syncServer, 500);

              // إجبار أي طلب شبكي على العودة بنجاح وتفعيل كامل
              var OG_SEND = XMLHttpRequest.prototype.send;
              XMLHttpRequest.prototype.send = function () {
                  var u = (this._url || "").toLowerCase();
                  if (u.indexOf("duplex") !== -1 || u.indexOf("geo") !== -1 || u.indexOf("renew") !== -1 || u.indexOf("status") !== -1 || u.indexOf("addrenewal") !== -1 || u.indexOf("activation") !== -1) {
                      var s = this;
                      setTimeout(function () {
                          var res = JSON.stringify({ Status: true, status: "active", IsValid: true, RemainDays: 365 });
                          try {
                              Object.defineProperty(s, "status", { value: 200, writable: true });
                              Object.defineProperty(s, "readyState", { value: 4, writable: true });
                              Object.defineProperty(s, "responseText", { value: res, writable: true });
                          } catch (e) {}
                          if (s.onload) s.onload();
                          if (s.onreadystatechange) s.onreadystatechange();
                      }, 10);
                      return;
                  }
                  return OG_SEND.apply(this, arguments);
              };

              // إزالة واختفاء أي نافذة تخص التفعيل أو الانتهاء بشكل مستمر وقوي
              var removeActivationPopups = function() {
                  var selectors = [
                      "[class*='expired']", "[class*='Expired']",
                      "[class*='activation']", "[class*='Activation']",
                      ".v-dialog", ".v-dialog--active"
                  ];
                  // البحث عن الألغام وحذفها إذا كانت تحتوي على كلمة منتهي أو تفعيل
                  var allDivs = document.getElementsByTagName("div");
                  for(var i=0; i<allDivs.length; i++) {
                      var txt = (allDivs[i].innerText || "").toLowerCase();
                      if(txt.indexOf("expired") !== -1 || txt.indexOf("activation") !== -1 || txt.indexOf("منتهي") !== -1 || txt.indexOf("تفعيل") !== -1) {
                          // التأكد من أنها ليست الشاشة الرئيسية
                          if(allDivs[i].offsetHeight < 500) {
                              allDivs[i].style.display = "none";
                              allDivs[i].innerHTML = "";
                          }
                      }
                  }
              };
              setInterval(removeActivationPopups, 100);

          })(window);
          EOF

          sed -i 's/iget-object v2, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v2, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
          sed -i 's/iget-object v1, v1, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v1, 0x0/g' decoded_apk/smali/c/b/f1.smali || true
