name: Inspect APK API URLs and Endpoints

on:
  push:
    branches: [ main ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl sed binutils

          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download Original APK
        run: |
          MF_URL="https://www.mediafire.com/file/jkn5lck5al5nf1w/gen_signed.apk"
          DIRECT_URL=$(curl -sL -A "Mozilla/5.0" "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          curl -L -o original.apk "$DIRECT_URL"

      - name: Decompile and Search All URLs & API Endpoints
        run: |
          apktool d -r original.apk -o decoded_apk

          echo "========================================="
          echo "1. جميع الروابط (http/https) داخل ملفات Smali:"
          echo "========================================="
          grep -rnE "https?://" decoded_apk/smali*/ | grep -vE "schemas\.android\.com|www\.w3\.org| google\.com|apache\.org|xmlpull\.org|example\.com" || true

          echo "========================================="
          echo "2. البحث عن الكود المسؤول عن رسالة انتهاء التفعيل:"
          echo "========================================="
          grep -rn -C 15 "Activation for" decoded_apk/smali*/ || true
          grep -rn -C 15 "device_key" decoded_apk/smali*/ || true
          grep -rn -C 15 "mac_address" decoded_apk/smali*/ || true

          echo "========================================="
          echo "3. فحص مكتبات الـ C++ (.so) لو كان الرابط مخفياً بداخلها:"
          echo "========================================="
          find decoded_apk/lib -name "*.so" -exec sh -c 'echo "--- File: $1 ---"; strings "$1" | grep -E "https?://|api\.php|egyplayer"' _ {} \; || true
