name: Build APK Bypass Region Check

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools & Download Original APK
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl sed zipalign apksigner
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          curl -L -o original.apk "https://egyplayer.com/egypro/duplexiptv.apk"
          apktool d -r original.apk -o decoded_apk

      - name: Bypass Region Check & Redirect Domain
        run: |
          # 1. استبدال النطاقات داخل ملفات Smali (هنا السر كله)
          find decoded_apk/smali* -type f -exec sed -i 's|edit.duplexplay.com|egyplayer.com|g' {} +
          find decoded_apk/smali* -type f -exec sed -i 's|edit.duplexiptv.com|egyplayer.com|g' {} +
          find decoded_apk/smali* -type f -exec sed -i 's|api.duplexplay.com|egyplayer.com|g' {} +
          find decoded_apk/smali* -type f -exec sed -i 's|api.duplexiptv.com|egyplayer.com|g' {} +
          find decoded_apk/smali* -type f -exec sed -i 's|duplexplay.com|egyplayer.com|g' {} +
          find decoded_apk/smali* -type f -exec sed -i 's|duplexiptv.com|egyplayer.com|g' {} +

          # 2. استبدال النطاقات في ملفات الويب
          find decoded_apk/assets -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" \) -exec sed -i 's|duplexplay.com|egyplayer.com|g' {} +
          find decoded_apk/assets -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" \) -exec sed -i 's|duplexiptv.com|egyplayer.com|g' {} +

          # 3. إنشاء سكربت تجاوز فحص المنطقة
          cat << 'EOF' > decoded_apk/assets/Web/region_bypass.js
          (function(win) {
              "use strict";
              try { localStorage.setItem("country_supported", "true"); } catch(e) {}
              setInterval(function() {
                  try {
                      var elements = document.querySelectorAll("span, p, h1, h2, h3, h4, div");
                      for (var i = 0; i < elements.length; i++) {
                          var txt = (elements[i].innerText || "").trim().toLowerCase();
                          if (txt.indexOf("not supported in your region") !== -1) {
                              elements[i].style.display = "none";
                          }
                      }
                  } catch(e) {}
              }, 50);
          })(window);
          EOF

          if [ -f "decoded_apk/assets/Web/index.html" ]; then
              sed -i 's/<head>/<head><script src="region_bypass.js"><\/script>/g' decoded_apk/assets/Web/index.html
          fi

      - name: Rebuild, Align and Sign APK
        run: |
          apktool b decoded_apk --use-aapt2 -o rebuilt_unsigned.apk
          zipalign -p -f 4 rebuilt_unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias egyplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=EgyPlayer,O=EGYSAT,C=EG"
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out egyplayer-hostinger.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-hostinger-release
          path: egyplayer-hostinger.apk
