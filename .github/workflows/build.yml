name: Build APK Bypass Full

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools & Download APK
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl sed zipalign apksigner
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          curl -L -o original.apk "https://egyplayer.com/egypro/duplexiptv.apk"
          apktool d -r original.apk -o decoded_apk

      - name: Patch APK & Extract URLs
        run: |
          # 1. إنشاء تقرير بكل الروابط الموجودة في الكود
          echo "=== URLs Found in Smali ===" > urls_report.txt
          grep -rhoE 'https?://[a-zA-Z0-9./?=_%:-]+' decoded_apk/smali* | sort -u >> urls_report.txt

          # 2. استبدال النطاقات (بشكل أوسع)
          find decoded_apk -type f -exec sed -i 's|duplexplay\.com|egyplayer.com|g' {} +
          find decoded_apk -type f -exec sed -i 's|duplexiptv\.com|egyplayer.com|g' {} +
          find decoded_apk -type f -exec sed -i 's|edit\.duplexplay|egyplayer.com|g' {} +
          find decoded_apk -type f -exec sed -i 's|api\.duplexplay|egyplayer.com|g' {} +

          # 3. مسح نص رسالة المنطقة
          find decoded_apk -type f -exec sed -i 's/Sorry. This app is not supported in your region//g' {} +
          find decoded_apk -type f -exec sed -i 's/not supported in your region//g' {} +

          # 4. إعداد ملف الأمان (SSL) وتفعيل الـ Cleartext
          mkdir -p decoded_apk/res/xml
          cat << 'EOF' > decoded_apk/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
          </base-config>
          </network-security-config>
          EOF
          sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" android:usesCleartextTraffic="true" /g' decoded_apk/AndroidManifest.xml

          # 5. ضرب حماية الـ CertificatePinner و TrustManager
          find decoded_apk/smali* -type f -name "*.smali" -exec sed -i '/\.method public final check(Ljava\/lang\/String;Ljava\/util\/List;)V/,/\.end method/c\
          .method public final check(Ljava/lang/String;Ljava/util/List;)V\
              .locals 0\
              return-void\
          .end method' {} +

          # كسر فحص التوقيع (Signature Check)
          find decoded_apk/smali* -type f -name "*.smali" -exec sed -i 's/iget-object v[0-9]*, v[0-9]*, Landroid\/content\/pm\/PackageInfo;->signatures:\[Landroid\/content\/pm\/Signature;/const\/4 v2, 0x0/g' {} + || true
          
          # 6. سكربت إخفاء المنطقة
          cat << 'EOF' > decoded_apk/assets/Web/region_bypass.js
          (function() { 
              localStorage.setItem("country_supported", "true"); 
              localStorage.setItem("region_check", "passed");
              setInterval(function() {
                  var elements = document.querySelectorAll("span, p, h1, h2, h3, h4, div");
                  for (var i = 0; i < elements.length; i++) {
                      if ((elements[i].innerText || "").indexOf("not supported") !== -1) {
                          elements[i].style.display = "none";
                      }
                  }
              }, 50);
          })();
          EOF
          find decoded_apk/assets -type f -name "*.html" -exec sed -i 's/<head>/<head><script src="region_bypass.js"><\/script>/g' {} +

      - name: Rebuild, Align and Sign APK
        run: |
          apktool b decoded_apk --use-aapt2 -o rebuilt_unsigned.apk
          zipalign -p -f 4 rebuilt_unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias egyplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=EgyPlayer,O=EGYSAT,C=EG"
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out egyplayer-hostinger.apk aligned.apk

      - name: Upload APK and URL Report
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-build-and-report
          path: |
            egyplayer-hostinger.apk
            urls_report.txt
