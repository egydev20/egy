name: Download, Update API, and Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip sed wget apksigner curl

      - name: Download Source from MediaFire & Extract
        run: |
          mkdir -p project_source
          # الحصول على الرابط المباشر من ميديافاير وتحميل الملف
          MF_URL="https://www.mediafire.com/file/3zyt7my1u0nmh2e/gen_signed.apk_Decompiler.com.zip"
          DIRECT_URL=$(curl -s "$MF_URL" | grep -o 'https://download[^"]*' | head -n 1)
          
          if [ -z "$DIRECT_URL" ]; then
            DIRECT_URL="$MF_URL"
          fi
          
          echo "Downloading from: $DIRECT_URL"
          wget -O source.zip "$DIRECT_URL" || curl -L -o source.zip "$MF_URL"
          
          unzip -q source.zip -d project_source

      - name: Update API URL to egyplayer.com
        run: |
          # البحث وتعديل أي رابط API قديم إلى الرابط الجديد المطلول
          find project_source -type f \( -name "*.smali" -o -name "*.xml" -o -name "*.json" -o -name "*.js" -o -name "*.properties" \) -exec sed -i 's|http://[^/]*\.com/api\.php|https://egyplayer.com/api.php|g' {} + || true
          find project_source -type f \( -name "*.smali" -o -name "*.xml" -o -name "*.json" -o -name "*.js" -o -name "*.properties" \) -exec sed -i 's|https://[^/]*\.com/api\.php|https://egyplayer.com/api.php|g' {} + || true
          
          # استبدال أي ذكر لنطاقات أخرى بـ egyplayer.com/api.php احترازياً
          find project_source -type f \( -name "*.smali" -o -name "*.xml" -o -name "*.json" \) -exec sed -i 's|egyplayer\.com|egyplayer.com|g' {} + || true

          # تجميع المشروع مباشرة إلى ملف APK
          cd project_source
          # إذا كان المشروع يحتوي على ملفات apktool أو ملفات جاهزة للضغط
          if [ -d "smali" ] || [ -f "apktool.yml" ]; then
            # ضغط الملفات المباشرة للمشروع المفكوك
            zip -r ../final-app.apk .
          else
            zip -r ../final-app.apk .
          fi
          cd ..

      - name: Sign APK with Modern Key (v2/v3 Scheme)
        run: |
          # توليد مفتاح التوقيع والتوقيع الحديث لضمان عدم ظهور خطأ الحزمة
          keytool -genkey -v -keystore release.keystore -alias egyplayerkey -keyalg RSA -keysize 2048 -keypass password123 -storepass password123 -dname "CN=EgyPlayer,O=Streaming,C=US" -validity 10000
          
          apksigner sign --ks release.keystore --ks-keypass pass:password123 --ks-pass pass:password123 final-app.apk || true
          cp final-app.apk egyplayer-fixed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
